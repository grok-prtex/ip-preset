name: Release

# タグ (v*) のpush、または手動実行 (workflow_dispatch) で、
# win-x64 向け自己完結・シングルファイルの IpPreset.exe を発行し、
# 配布用一式を IpPreset-win-x64.zip にまとめて Release アセットとしてアップロードします。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Releaseを作成する対象のタグ名 (例: v1.0.0)。
          空欄の場合はRelease作成をスキップし、ビルド成果物(Zip)をワークフローの
          Artifactとしてのみアップロードします。
        required: false
        default: ''

permissions:
  contents: write

env:
  ZIP_NAME: IpPreset-win-x64.zip

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: .NET 8 SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: NuGet パッケージを復元
        run: dotnet restore IpPreset.sln

      - name: ユニットテストを実行 (IpPreset.Core)
        run: dotnet test tests/IpPreset.Tests/IpPreset.Tests.csproj --configuration Release

      - name: 発行 (win-x64 / 自己完結 / シングルファイル)
        run: >
          dotnet publish src/IpPreset/IpPreset.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist

      - name: 配布用ファイルを同梱
        shell: pwsh
        run: |
          Copy-Item -Path setup.cmd -Destination dist/setup.cmd -Force
          Copy-Item -Path presets.example.json -Destination dist/presets.example.json -Force
          Copy-Item -Path README.md -Destination dist/README.md -Force
          Copy-Item -Path DISTRIBUTE.md -Destination dist/DISTRIBUTE.md -Force
          Get-ChildItem dist

      - name: Zipを作成
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ env.ZIP_NAME }} -Force

      - name: Zipをワークフロー Artifact としてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Releaseタグを決定
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release にZipをアップロード
        if: steps.release_tag.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: IPプリセット ${{ steps.release_tag.outputs.tag }}
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
