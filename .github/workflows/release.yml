name: Release

# タグ (v*) の push、または手動実行 (workflow_dispatch) で、
# PowerShell 配布一式を IpPreset-win.zip にまとめて Release アセットとしてアップロードします。
# 署名なし .exe の SmartScreen を避けるため、主成果物は .ps1 + .cmd です（dotnet exe はリリースしません）。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Releaseを作成する対象のタグ名 (例: v0.2.0)。
          空欄の場合はRelease作成をスキップし、ビルド成果物(Zip)をワークフローの
          Artifactとしてのみアップロードします。
        required: false
        default: ''

permissions:
  contents: write

env:
  ZIP_NAME: IpPreset-win.zip

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 配布用フォルダを組み立て
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path ps/IpPreset.ps1 -Destination dist/IpPreset.ps1 -Force
          Copy-Item -Path ps/IpPreset.cmd -Destination dist/IpPreset.cmd -Force
          Copy-Item -Path ps/IpPreset-launch.vbs -Destination dist/IpPreset-launch.vbs -Force
          Copy-Item -Path ps/setup.cmd -Destination dist/setup.cmd -Force
          Copy-Item -Path ps/presets.example.json -Destination dist/presets.example.json -Force
          Copy-Item -Path ps/README.md -Destination dist/README.md -Force
          Get-ChildItem dist

      - name: Zipを作成
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ env.ZIP_NAME }} -Force

      - name: Zipをワークフロー Artifact としてアップロード
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Releaseタグを決定
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release にZipをアップロード
        if: steps.release_tag.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: IPプリセット ${{ steps.release_tag.outputs.tag }}
          body: |
            ## 配布物

            - **`IpPreset-win.zip`** — PowerShell GUI（推奨・SmartScreen回避）
              - `IpPreset.cmd` をダブルクリックして起動（コンソール非表示）
              - 初回は `setup.cmd` 推奨（Unblock + デスクトップショートカット）
              - 適用時のみ UAC 確認があります（起動時は管理者不要）

            C# / 単一 exe 版はリポジトリに残していますが、署名なし exe の SmartScreen を避けるため Release には含めていません。
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
